name: One-shot stable Lua 5.0.2 check

on:
  push:
    branches:
      - release/0.1.10
    paths:
      - .github/workflows/lua50-release-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
      - name: Build verified Lua 5.0.2 compiler and check stable tree
        run: |
          set -euxo pipefail
          curl -fsSLo /tmp/lua-5.0.2.tar.gz https://www.lua.org/ftp/lua-5.0.2.tar.gz
          echo "a6c85d85f912e1c321723084389d63dee7660b81b8292452b190ea7190dd73bc  /tmp/lua-5.0.2.tar.gz" | sha256sum -c -
          mkdir -p /tmp/lua50
          tar -xzf /tmp/lua-5.0.2.tar.gz -C /tmp/lua50 --strip-components=1
          cc -O2 -fcommon -DLUA_OPNAMES \
            -I/tmp/lua50/include -I/tmp/lua50/src \
            /tmp/lua50/src/lapi.c /tmp/lua50/src/lcode.c /tmp/lua50/src/ldebug.c \
            /tmp/lua50/src/ldo.c /tmp/lua50/src/ldump.c /tmp/lua50/src/lfunc.c \
            /tmp/lua50/src/lgc.c /tmp/lua50/src/llex.c /tmp/lua50/src/lmem.c \
            /tmp/lua50/src/lobject.c /tmp/lua50/src/lopcodes.c /tmp/lua50/src/lparser.c \
            /tmp/lua50/src/lstate.c /tmp/lua50/src/lstring.c /tmp/lua50/src/ltable.c \
            /tmp/lua50/src/ltm.c /tmp/lua50/src/lundump.c /tmp/lua50/src/lvm.c \
            /tmp/lua50/src/lzio.c /tmp/lua50/src/lib/lauxlib.c \
            /tmp/lua50/src/luac/luac.c /tmp/lua50/src/luac/print.c -lm -o /tmp/luac50
          /tmp/luac50 -v
          find addon -type f -name '*.lua' -print0 | xargs -0 -n1 /tmp/luac50 -p --
