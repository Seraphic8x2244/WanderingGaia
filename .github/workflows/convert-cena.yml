name: Convert Cena audio

on:
  push:
    branches:
      - dev
    paths:
      - artwork/cena.mp3
      - .github/workflows/convert-cena.yml

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert rank-timed WAV assets
        run: |
          set -eux
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 artwork/cena.mp3

          ffmpeg -y -i artwork/cena.mp3 -t 6.5 -ac 1 -ar 44100 -c:a pcm_s16le -af "afade=t=out:st=6:d=0.5" artwork/cena_r1.wav
          ffmpeg -y -i artwork/cena.mp3 -t 8.5 -ac 1 -ar 44100 -c:a pcm_s16le -af "afade=t=out:st=8:d=0.5" artwork/cena_r2.wav
          ffmpeg -y -i artwork/cena.mp3 -t 10.5 -ac 1 -ar 44100 -c:a pcm_s16le -af "afade=t=out:st=10:d=0.5" artwork/cena.wav

          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 artwork/cena_r1.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 artwork/cena_r2.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 artwork/cena.wav

          rm artwork/cena.mp3

      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/cena.mp3 artwork/cena_r1.wav artwork/cena_r2.wav artwork/cena.wav
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Convert Cena source to rank-timed WAV assets"
          git push origin HEAD:dev
